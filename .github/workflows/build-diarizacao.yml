name: build-diarizacao

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'check_compat.py'
      - '.github/workflows/build-diarizacao.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  deps:
    name: deps (metadados + dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate 0 — check_compat.py
        run: |
          set -euo pipefail
          pip install --quiet packaging
          python check_compat.py docker/requirements.txt

      - name: Gate 1 — pip resolve com torch CPU instalado
        run: |
          set -euo pipefail
          pip install --quiet --upgrade pip setuptools wheel
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu \
              "torch==2.5.1+cpu" "torchaudio==2.5.1+cpu"
          pip install --dry-run -r docker/requirements.txt > /tmp/dryrun.txt
          cat /tmp/dryrun.txt
          # guarda contra torch CUDA / nvidia-*
          if grep -qE 'nvidia-|triton' /tmp/dryrun.txt; then
            echo "::error::dry-run resolveu torch CUDA — ordem do Dockerfile quebrada"
            exit 1
          fi

  build:
    name: build (amd64)
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Guard — COPY não pode ter prefixo docker/
        run: |
          set -euo pipefail
          if grep -qE '^COPY +docker/' docker/Dockerfile; then
            echo "::error::Dockerfile usa 'COPY docker/...' mas o context é ./docker"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: diarizacao:amd64-latest
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: pip check dentro da imagem
        id: pip_check
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint pip diarizacao:amd64-latest check \
            2>&1 | tee "$RUNNER_TEMP/pip_check.txt"
          grep -q "No broken requirements found" "$RUNNER_TEMP/pip_check.txt" \
            || { echo "::error::pip check falhou"; exit 1; }

      - name: --check dentro da imagem
        id: run_check
        if: steps.build.outcome == 'success' && steps.pip_check.outcome == 'success'
        run: |
          set -euo pipefail
          docker run --rm diarizacao:amd64-latest --check \
            2>&1 | tee "$RUNNER_TEMP/run_check.txt"
          grep -q "cuda available" "$RUNNER_TEMP/run_check.txt" \
            || { echo "::error::--check não imprimiu cuda available"; exit 1; }

      - name: pip freeze
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint pip diarizacao:amd64-latest freeze \
            > "$RUNNER_TEMP/pip_freeze.txt"

      - name: Salvar imagem
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          docker save diarizacao:amd64-latest \
            | gzip > "$RUNNER_TEMP/diarizacao-amd64.tar.gz"
          sha256sum "$RUNNER_TEMP/diarizacao-amd64.tar.gz" \
            > "$RUNNER_TEMP/diarizacao-amd64.sha256"

      - name: Upload do artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: diarizacao-amd64
          path: |
            ${{ runner.temp }}/diarizacao-amd64.tar.gz
            ${{ runner.temp }}/diarizacao-amd64.sha256
            ${{ runner.temp }}/pip_check.txt
            ${{ runner.temp }}/pip_freeze.txt
            ${{ runner.temp }}/run_check.txt
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## diarizacao — amd64"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| build | \`${{ steps.build.outcome }}\` |"
            echo "| pip check | \`${{ steps.pip_check.outcome }}\` |"
            echo "| --check | \`${{ steps.run_check.outcome }}\` |"
            echo ""
            for f in pip_check run_check; do
              if [ -f "$RUNNER_TEMP/$f.txt" ]; then
                echo "### $f"
                echo '```'
                cat "$RUNNER_TEMP/$f.txt"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
